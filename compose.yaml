services:
  deepseek-v4-flash-0731:
    image: ${IMAGE:-ghcr.io/liquidgravityai/2x-dgx-spark-deepseek-v4-flash-0731:r7-sglang-d2c405f-flashinfer-67f7637-cu132}
    container_name: deepseek-v4-flash-0731-sglang-${NODE_RANK:?set NODE_RANK to 0 or 1}
    gpus: all
    network_mode: host
    ipc: host
    shm_size: ${SHM_SIZE:-64g}
    init: true
    devices:
      - /dev/infiniband:/dev/infiniband
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: -1
      nofile: 1048576
      stack: 67108864
    environment:
      OMP_NUM_THREADS: "16"
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_MAX_CONNECTIONS: "${CUDA_DEVICE_MAX_CONNECTIONS:-1}"
      SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: "0"
      SGLANG_RAGGED_VERIFY_MODE: "${RAGGED_VERIFY_MODE:-compact}"
      SGLANG_OPT_USE_TILELANG_MHC_PRE: "1"
      SGLANG_OPT_DEEPGEMM_HC_PRENORM: "1"
      SGLANG_OPT_FP8_WO_A_GEMM: "1"
      CUTE_DSL_ARCH: sm_121a
      SAFETENSORS_FAST_GPU: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${IB_HCA:?set IB_HCA to the RDMA device name}"
      NCCL_IB_GID_INDEX: "${IB_GID_INDEX:?set IB_GID_INDEX for the selected RoCE address}"
      NCCL_SOCKET_IFNAME: "${FABRIC_IFACE:?set FABRIC_IFACE to the high-speed interface}"
      GLOO_SOCKET_IFNAME: "${FABRIC_IFACE:?set FABRIC_IFACE to the high-speed interface}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"

      HF_HUB_OFFLINE: "1"
      HF_HOME: /cache/huggingface
      TRITON_CACHE_DIR: /cache/jit/triton
      TORCH_EXTENSIONS_DIR: /cache/jit/torch_extensions
      FLASHINFER_CACHE_DIR: /cache/jit/flashinfer
      FLASHINFER_WORKSPACE_BASE: /cache/jit/flashinfer
      TVM_FFI_CACHE_DIR: /cache/jit/tvm-ffi
      XDG_CACHE_HOME: /cache/jit
    volumes:
      - /dev/shm:/dev/shm
      - ${MODEL_HOST_PATH:?set MODEL_HOST_PATH to the downloaded model directory}:/model:ro
      - ${CACHE_HOST_PATH:?set CACHE_HOST_PATH to a writable cache directory}:/cache:rw
      - ${ROOT_CACHE_HOST_PATH:-${CACHE_HOST_PATH:?set CACHE_HOST_PATH to a writable cache directory}-root}:/root/.cache/sglang:rw
    command:
      - python
      - -m
      - sglang.launch_server
      - --model-path=/model
      - --served-model-name=${SERVED_MODEL_NAME:-deepseek-v4-flash-0731}
      - --trust-remote-code
      - --tp-size=2
      - --nnodes=2
      - --node-rank=${NODE_RANK:?set NODE_RANK to 0 or 1}
      - --dist-init-addr=${MASTER_ADDR:?set MASTER_ADDR to rank 0 fabric address}:${MASTER_PORT:-20000}
      - --context-length=${MAX_MODEL_LEN:-270000}
      - --max-running-requests=${MAX_NUM_SEQS:-4}
      - --max-total-tokens=${MAX_TOTAL_TOKENS:-1113832}
      - --chunked-prefill-size=${CHUNKED_PREFILL_SIZE:-8192}
      - --max-prefill-tokens=${MAX_PREFILL_TOKENS:-16384}
      - --swa-full-tokens-ratio=${SWA_FULL_TOKENS_RATIO:-0.1}
      - --mem-fraction-static=${MEM_FRACTION_STATIC:-0.82}
      - --cuda-graph-max-bs-decode=${CUDA_GRAPH_MAX_BS:-4}
      - --fp8-gemm-backend=auto
      - --speculative-algorithm=DSPARK
      - --speculative-dspark-block-size=${DSPARK_BLOCK_SIZE:-5}
      - --speculative-dspark-sps-table-path=/etc/sglang/dspark_sps_r6_profile.json
      - --disable-radix-cache
      - --reasoning-parser=deepseek-v4
      - --tool-call-parser=deepseekv4
      - '--default-chat-template-kwargs={"thinking":true,"reasoning_effort":"${DEEPSEEK_REASONING_EFFORT:-max}"}'
      - '--model-loader-extra-config={"num_threads":2}'
      - --enable-metrics
      - --host=0.0.0.0
      - --port=${API_PORT:-8000}
