services:
  deepseek-v4-flash-0731:
    image: ${IMAGE:-ghcr.io/liquidgravityai/2x-dgx-spark-deepseek-v4-flash-0731:r27-vllm-966d57c-sparkinfer-bbbdccc-cu132}
    container_name: deepseek-v4-flash-0731-${NODE_RANK:?set NODE_RANK to 0 or 1}
    command:
      - "--default-chat-template-kwargs.reasoning_effort=${DEEPSEEK_REASONING_EFFORT:-max}"
    gpus: all
    network_mode: host
    ipc: host
    shm_size: ${SHM_SIZE:-64g}
    init: true
    devices:
      - /dev/infiniband:/dev/infiniband
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: -1
      nofile: 1048576
      stack: 67108864
    environment:
      MODEL_PATH: /model
      MODEL_REVISION_OVERRIDE: ${MODEL_REVISION_OVERRIDE:-9e165c30e2704aec5d9d593cce3eebd58bbef1cb}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-deepseek-v4-flash-0731}
      PORT: ${API_PORT:-8000}
      NNODES: "2"
      TP_SIZE: "2"
      NODE_RANK: ${NODE_RANK:?set NODE_RANK to 0 or 1}
      MASTER_ADDR: ${MASTER_ADDR:?set MASTER_ADDR to rank 0 fabric address}
      MASTER_PORT: ${MASTER_PORT:-29501}
      VLLM_HOST_IP: ${VLLM_HOST_IP:?set VLLM_HOST_IP to this node fabric address}

      VLLM_ENABLE_DSPARK: "1"
      DCP_SIZE: "1"
      NUM_SPECULATIVE_TOKENS: ${NUM_SPECULATIVE_TOKENS:-6}
      DSPARK_DRAFT_SAMPLE_METHOD: ${DSPARK_DRAFT_SAMPLE_METHOD:-greedy}
      DSPARK_SPS_CURVE: ${DSPARK_SPS_CURVE:-auto}
      VLLM_DSPARK_FP8_DRAFT_HEAD: ${VLLM_DSPARK_FP8_DRAFT_HEAD:-0}
      VLLM_DSPARK_DYNAMIC_DRAFT_DEPTH: ${VLLM_DSPARK_DYNAMIC_DRAFT_DEPTH:-0}
      VLLM_DSPARK_CAPACITY_ACTIVATION_BATCH_SIZE: ${VLLM_DSPARK_CAPACITY_ACTIVATION_BATCH_SIZE:-0}
      B12X_FUSED_INDEXER: "1"

      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.82}
      # Explicitly sized per rank; yields 1,113,832 aggregate GPU KV tokens.
      KV_CACHE_MEMORY_BYTES: ${KV_CACHE_MEMORY_BYTES:-20000000000}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-270000}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-4}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-4096}
      LOAD_FORMAT: safetensors
      ENABLE_PREFIX_CACHING: ${ENABLE_PREFIX_CACHING:-0}
      ENABLE_FLASHINFER_AUTOTUNE: ${ENABLE_FLASHINFER_AUTOTUNE:-0}
      VLLM_PROFILE: ${VLLM_PROFILE:-0}

      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: ${IB_HCA:?set IB_HCA to the RDMA device name}
      NCCL_IB_GID_INDEX: ${IB_GID_INDEX:?set IB_GID_INDEX for the selected RoCE address}
      NCCL_SOCKET_IFNAME: ${FABRIC_IFACE:?set FABRIC_IFACE to the high-speed network interface}
      GLOO_SOCKET_IFNAME: ${FABRIC_IFACE:?set FABRIC_IFACE to the high-speed network interface}
      TP_SOCKET_IFNAME: ${FABRIC_IFACE:?set FABRIC_IFACE to the high-speed network interface}
      UCX_NET_DEVICES: ${FABRIC_IFACE:?set FABRIC_IFACE to the high-speed network interface}
      NCCL_CROSS_NIC: ${NCCL_CROSS_NIC:-1}
      NCCL_CUMEM_ENABLE: ${NCCL_CUMEM_ENABLE:-0}
      NCCL_IGNORE_CPU_AFFINITY: ${NCCL_IGNORE_CPU_AFFINITY:-1}
      NCCL_DEBUG: ${NCCL_DEBUG:-WARN}

      HF_HUB_OFFLINE: "1"
      HF_HOME: /cache/huggingface
      VLLM_CACHE_ROOT: /cache/jit
      VLLM_CACHE_DIR: /cache/jit/vllm
      TRITON_CACHE_DIR: /cache/jit/triton
      FLASHINFER_CACHE_DIR: /cache/jit/flashinfer
      B12X_CACHE_DIR: /cache/jit/b12x
    volumes:
      - /dev/shm:/dev/shm
      - ${MODEL_HOST_PATH:?set MODEL_HOST_PATH to the downloaded model directory}:/model:ro
      - ${CACHE_HOST_PATH:?set CACHE_HOST_PATH to a writable cache directory}:/cache:rw
